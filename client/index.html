<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />

    <meta name="theme-color" content="#1927F4" />
    <meta name="description" content="Dkart.pk is Pakistan's premier online store for smart tech gadgets, hair styling tools, and personal care innovations. Enjoy nationwide Cash on Delivery (COD), 2-4 days express delivery, and 7-day doorstep replacement guarantee." />
    <meta name="keywords" content="Dkart, online shopping Pakistan, hair straightener, hair dryer brush, rechargeable shaver, personal care gadgets, cash on delivery Pakistan" />

    <link rel="canonical" href="https://www.dkart.pk/" />

    <!-- Open Graph / Facebook / WhatsApp Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.dkart.pk/" />
    <meta property="og:title" content="Dkart | Pakistan's Premier Online Store - dkart.pk" />
    <meta property="og:description" content="Shop premium smart gadgets, personal care, and hair styling tools at Dkart Pakistan. Nationwide Cash on Delivery (COD) & 7-day guarantee." />

    <meta property="og:site_name" content="Dkart.pk" />
    <meta property="og:locale" content="en_PK" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.dkart.pk/" />
    <meta name="twitter:title" content="Dkart | Pakistan's Premier Online Store" />
    <meta name="twitter:description" content="Shop premium styling gadgets and personal care tech in Pakistan with Cash on Delivery." />
    <meta name="twitter:image" content="https://www.dkart.pk/logo.png" />

    <!-- Schema.org Organization & WebSite JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Dkart",
      "url": "https://www.dkart.pk",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.dkart.pk/shop?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Dkart Pakistan",
      "url": "https://www.dkart.pk",
      "logo": "https://www.dkart.pk/logo.png",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+923425097760",
        "contactType": "customer service",
        "areaServed": "PK",
        "availableLanguage": ["English", "Urdu"]
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body class="bg-white text-[#414042] min-h-screen">
